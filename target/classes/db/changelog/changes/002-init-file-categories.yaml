databaseChangeLog:
  - changeSet:
      id: 002-1-create-table-file-categories
      author: platform
      changes:
        - createTable:
            tableName: file_categories
            columns:
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: bucket_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: allowed_mime_types
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: max_size_bytes
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: require_virus_scan
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: is_public
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: retention_days
                  type: INT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
