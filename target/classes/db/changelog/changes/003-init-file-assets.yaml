databaseChangeLog:
  - changeSet:
      id: 003-1-create-table-file-assets
      author: platform
      changes:
        - createTable:
            tableName: file_assets
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: category_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: bucket_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: object_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: original_filename
                  type: VARCHAR(500)
              - column:
                  name: mime_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: size_bytes
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: checksum_sha256
                  type: VARCHAR(64)
              - column:
                  name: storage_status
                  type: VARCHAR(20)
                  defaultValue: UPLOADING
                  constraints:
                    nullable: false
              - column:
                  name: scan_status
                  type: VARCHAR(20)
                  defaultValue: SKIPPED
                  constraints:
                    nullable: false
              - column:
                  name: owner_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: uploaded_by
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: job_id
                  type: UUID
              - column:
                  name: expires_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP

  - changeSet:
      id: 003-2-unique-file-assets-bucket-object-key
      author: platform
      changes:
        - addUniqueConstraint:
            tableName: file_assets
            columnNames: bucket_name, object_key
            constraintName: uk_file_assets_bucket_object_key

  - changeSet:
      id: 003-3-check-file-assets-storage-status
      author: platform
      changes:
        - sql:
            sql: >-
              ALTER TABLE file_assets ADD CONSTRAINT chk_file_assets_storage_status
              CHECK (storage_status IN ('UPLOADING', 'UPLOADED_DMZ', 'SCANNING', 'CLEAN', 'INFECTED', 'QUARANTINED'));
      rollback:
        - sql:
            sql: ALTER TABLE file_assets DROP CONSTRAINT chk_file_assets_storage_status;

  - changeSet:
      id: 003-4-check-file-assets-scan-status
      author: platform
      changes:
        - sql:
            sql: >-
              ALTER TABLE file_assets ADD CONSTRAINT chk_file_assets_scan_status
              CHECK (scan_status IN ('SKIPPED', 'PENDING', 'CLEAN', 'INFECTED'));
      rollback:
        - sql:
            sql: ALTER TABLE file_assets DROP CONSTRAINT chk_file_assets_scan_status;

  - changeSet:
      id: 003-5-fk-file-assets-category-code
      author: platform
      changes:
        - addForeignKeyConstraint:
            baseTableName: file_assets
            baseColumnNames: category_code
            referencedTableName: file_categories
            referencedColumnNames: code
            constraintName: fk_file_assets_category_code

  - changeSet:
      id: 003-6-fk-file-assets-job-id
      author: platform
      changes:
        - addForeignKeyConstraint:
            baseTableName: file_assets
            baseColumnNames: job_id
            referencedTableName: jobs
            referencedColumnNames: id
            constraintName: fk_file_assets_job_id

  - changeSet:
      id: 003-7-index-file-assets-owner
      author: platform
      changes:
        - createIndex:
            indexName: idx_file_assets_owner
            tableName: file_assets
            columns:
              - column:
                  name: owner_type
              - column:
                  name: owner_id

  - changeSet:
      id: 003-8-index-file-assets-category-status-expiry
      author: platform
      changes:
        - createIndex:
            indexName: idx_file_assets_category_status_expiry
            tableName: file_assets
            columns:
              - column:
                  name: category_code
              - column:
                  name: storage_status
              - column:
                  name: expires_at

  - changeSet:
      id: 003-9-index-file-assets-job-id
      author: platform
      changes:
        - createIndex:
            indexName: idx_file_assets_job_id
            tableName: file_assets
            columns:
              - column:
                  name: job_id
