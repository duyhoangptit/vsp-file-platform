databaseChangeLog:
  - changeSet:
      id: 004-1-create-table-audit-logs
      author: platform
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: actor_id
                  type: UUID
              - column:
                  name: action
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: resource_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: resource_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: metadata
                  type: JSONB
              - column:
                  name: result
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-2-check-audit-logs-result
      author: platform
      changes:
        - sql:
            sql: >-
              ALTER TABLE audit_logs ADD CONSTRAINT chk_audit_logs_result
              CHECK (result IN ('SUCCESS', 'DENIED', 'FAILED'));
      rollback:
        - sql:
            sql: ALTER TABLE audit_logs DROP CONSTRAINT chk_audit_logs_result;

  - changeSet:
      id: 004-3-index-audit-logs-resource
      author: platform
      changes:
        - createIndex:
            indexName: idx_audit_logs_resource
            tableName: audit_logs
            columns:
              - column:
                  name: resource_type
              - column:
                  name: resource_id
              - column:
                  name: created_at

  - changeSet:
      id: 004-4-index-audit-logs-actor
      author: platform
      changes:
        - createIndex:
            indexName: idx_audit_logs_actor
            tableName: audit_logs
            columns:
              - column:
                  name: actor_id
              - column:
                  name: created_at
