databaseChangeLog:
  - changeSet:
      id: 001-1-create-table-jobs
      author: platform
      changes:
        - createTable:
            tableName: jobs
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: SMALLINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: result_location
                  type: VARCHAR(500)
              - column:
                  name: idempotency_key
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_jobs_idempotency_key
              - column:
                  name: total_units
                  type: BIGINT
              - column:
                  name: processed_units
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: heartbeat_at
                  type: TIMESTAMP
              - column:
                  name: retry_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-2-check-jobs-status
      author: platform
      changes:
        - sql:
            sql: >-
              ALTER TABLE jobs ADD CONSTRAINT chk_jobs_status
              CHECK (status IN ('PENDING', 'PROCESSING', 'DONE', 'FAILED', 'EXPIRED'));
      rollback:
        - sql:
            sql: ALTER TABLE jobs DROP CONSTRAINT chk_jobs_status;

  - changeSet:
      id: 001-3-index-jobs-created-by-status
      author: platform
      changes:
        - createIndex:
            indexName: idx_jobs_created_by_status
            tableName: jobs
            columns:
              - column:
                  name: created_by
              - column:
                  name: status

  - changeSet:
      id: 001-4-index-jobs-scheduler
      author: platform
      changes:
        - createIndex:
            indexName: idx_jobs_status_priority_created_at
            tableName: jobs
            columns:
              - column:
                  name: status
              - column:
                  name: priority
                  descending: true
              - column:
                  name: created_at
