spring:
  application:
    name: file-platform
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  task:
    scheduling:
      pool:
        size: 2
  lifecycle:
    # Đủ lớn hơn app.job.execution.shutdown-timeout-seconds (mặc định 20s) để
    # JobDispatchShutdownCoordinator không bị Spring ngắt ngang giữa lúc awaitTermination().
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:25s}
  kafka:
    bootstrap-servers: ${APP_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${spring.application.name}-job-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.company.platform.job.messaging
        spring.json.value.default.type: com.company.platform.job.messaging.JobMessage
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    listener:
      ack-mode: manual
  data:
    redis:
      host: ${APP_REDIS_HOST:redis}
      port: ${APP_REDIS_PORT:6379}
      password: ${APP_REDIS_PASSWORD:}

# Service chạy trong internal network, không public ra ngoài (xem design doc) nên chỉ
# chặn qua exposure whitelist, không thêm auth riêng cho Actuator ở tầng app.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
    env:
      enabled: false
    heapdump:
      enabled: false
    shutdown:
      enabled: false

app:
  # Shared secret cho các endpoint /api/internal/** (VD downloadFileBytes) — service-to-service,
  # không đại diện end-user nên không dùng UserContext/RequiresAccess (mục 3 design doc
  # 2026-08-08-internal-download-bytes-api-design.md). Cố tình KHÔNG đặt default thật ở đây,
  # bắt buộc set qua APP_INTERNAL_API_KEY, thiếu thì app fail fast lúc khởi động.
  internal-api:
    key: ${APP_INTERNAL_API_KEY:}
  minio:
    endpoint: ${APP_MINIO_ENDPOINT:http://minio:9000}
    access-key: ${APP_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${APP_MINIO_SECRET_KEY:minioadmin123}
    connect-timeout-millis: ${APP_MINIO_CONNECT_TIMEOUT_MILLIS:10000}
    write-timeout-millis: ${APP_MINIO_WRITE_TIMEOUT_MILLIS:10000}
    read-timeout-millis: ${APP_MINIO_READ_TIMEOUT_MILLIS:10000}
  job:
    kafka:
      topic: ${APP_JOB_KAFKA_TOPIC:job-events}
    # Ngưỡng đặt trong mục 12 design doc là "chưa quyết định — để config, không hardcode";
    # 2 JobType hiện tại cũng chỉ là placeholder (chưa có processor thật) nên số liệu dưới
    # đây chỉ là giá trị mặc định tạm, chỉnh qua config khi có nghiệp vụ thật.
    max-active-per-user: ${APP_JOB_MAX_ACTIVE_PER_USER:5}
    execution:
      # Executor pool riêng chạy doExecute(), tách khỏi thread gọi process() (mục 6.4).
      pool-size: ${APP_JOB_EXECUTION_POOL_SIZE:4}
      # JobDispatchShutdownCoordinator: thời gian chờ job đang chạy hoàn tất trước khi
      # shutdownNow() ép dừng.
      shutdown-timeout-seconds: ${APP_JOB_EXECUTION_SHUTDOWN_TIMEOUT_SECONDS:20}
    # Lưới an toàn mục 6.2: quét PENDING job già hơn interval này để tự trigger dispatch,
    # phòng trường hợp message (Kafka/Redis) bị mất.
    fallback-poller:
      interval: ${APP_JOB_FALLBACK_POLLER_INTERVAL:30s}
    rate-limit:
      EXPORT_USER_CSV:
        capacity: 10
        refill-tokens: 10
        refill-period: 1m
      IMPORT_PRODUCT:
        capacity: 5
        refill-tokens: 5
        refill-period: 1m
      IMPORT_USER:
        capacity: 5
        refill-tokens: 5
        refill-period: 1m
  export:
    user-csv:
      page-size: ${APP_EXPORT_USER_CSV_PAGE_SIZE:500}
  import:
    user-csv:
      batch-size: ${APP_IMPORT_USER_CSV_BATCH_SIZE:500}
  cleanup:
    # Mục 10/12 design doc: Retention & Cleanup, ngưỡng "chưa quyết định — để config"; giá trị
    # dưới đây chỉ là mặc định tạm.
    interval: ${APP_CLEANUP_INTERVAL:15m}
    batch-size: ${APP_CLEANUP_BATCH_SIZE:500}
    job-done-retention: ${APP_CLEANUP_JOB_DONE_RETENTION:30d}
    # Phiên multipart mở quá lâu (client bỏ dở) — CleanupService gọi AbortMultipartUpload +
    # soft-delete metadata (mục 8.1 design doc).
    multipart-upload-timeout: ${APP_CLEANUP_MULTIPART_UPLOAD_TIMEOUT:2h}

# messaging.provider chọn adapter Kafka/Redis cho JobEventPublisher/Consumer (mục 6.2
# design doc). Cố tình KHÔNG set ở đây (tắt mặc định) để không ảnh hưởng các test/context
# full Spring context không cần Kafka — bật thật ở application-dev.yml hoặc qua env
# MESSAGING_PROVIDER khi deploy.
